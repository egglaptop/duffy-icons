<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>DUFFY KIT</title>

  <meta name="theme-color" content="#303232">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="DUFFY KIT"
  >

  <link
    rel="apple-touch-icon"
    sizes="512x512"
    href="https://egglaptop.github.io/duffy-icons/DUFFY-KIT-ICON.png"
  >

  <link
    rel="apple-touch-icon-precomposed"
    sizes="512x512"
    href="https://egglaptop.github.io/duffy-icons/DUFFY-KIT-ICON.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="https://egglaptop.github.io/duffy-icons/DUFFY-KIT-ICON.png"
  >

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#f3f4f4;
      color:#151817;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .box{
      width:min(420px,100%);
      text-align:center;
    }

    .icon{
      width:96px;
      height:96px;
      margin:0 auto 20px;
      border-radius:22px;
      display:block;
    }

    h1{
      margin:0 0 8px;
      font-size:22px;
      font-weight:900;
    }

    p{
      margin:0;
      color:#68716d;
      font-size:14px;
      line-height:1.45;
    }

    input{
      width:100%;
      height:48px;
      margin-top:20px;
      border:1px solid #d8ddda;
      border-radius:11px;
      background:#fff;
      padding:0 12px;
      font:inherit;
      font-size:16px;
      outline:none;
    }

    button{
      width:100%;
      min-height:48px;
      margin-top:18px;
      border:0;
      border-radius:11px;
      background:#018749;
      color:#fff;
      font:inherit;
      font-weight:900;
      cursor:pointer;
    }

    .error{
      min-height:20px;
      margin-top:10px;
      color:#b42318;
      font-size:13px;
    }

    #setup{
      display:none;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      class="icon"
      src="https://egglaptop.github.io/duffy-icons/DUFFY-KIT-ICON.png"
      alt=""
    >

    <div id="ready">
      <h1>DUFFY KIT</h1>

      <p>
        Add this page to your Home Screen.
        Then open DUFFY KIT from the new icon.
      </p>

      <button onclick="openFromSafari()">
        Open DUFFY KIT
      </button>
    </div>

    <div id="setup">
      <h1>DUFFY KIT</h1>

      <p>
        Enter your private DUFFY access key once on this device.
      </p>

      <input
        id="key"
        type="password"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Private access key"
      >

      <button onclick="saveKey()">
        Open DUFFY KIT
      </button>

      <div
        id="error"
        class="error"
      ></div>
    </div>

  </div>

<script>

const APP_URL =
  'https://script.google.com/macros/s/AKfycbyMxv3Lq6MvkL4Su9zMOgQaYWUoqKiZVyf8szKvXup_McV5bCCxd67t1MG26LcgAS4-Aw/exec';

const STORAGE_KEY =
  'duffyPrivateAccessKey';

function getKey(){
  try{
    return localStorage.getItem(STORAGE_KEY) || '';
  }catch(e){
    return '';
  }
}

function destination(key){
  return (
    APP_URL +
    '?view=kit&key=' +
    encodeURIComponent(key)
  );
}

function isStandalone(){
  return (
    window.matchMedia(
      '(display-mode: standalone)'
    ).matches ||
    window.navigator.standalone === true
  );
}

function openApp(key){
  window.location.href =
    destination(key);
}

function showSetup(){
  document.getElementById(
    'ready'
  ).style.display='none';

  document.getElementById(
    'setup'
  ).style.display='block';
}

function saveKey(){
  const input =
    document.getElementById('key');

  const error =
    document.getElementById('error');

  const key =
    (input.value || '').trim();

  if(!key){
    error.textContent =
      'Enter the private access key.';

    return;
  }

  try{
    localStorage.setItem(
      STORAGE_KEY,
      key
    );
  }catch(e){}

  openApp(key);
}

function openFromSafari(){
  const key = getKey();

  if(key){
    openApp(key);
    return;
  }

  showSetup();
}

(function start(){

  /*
   * IMPORTANT:
   *
   * Safari stays on this GitHub page.
   * This lets iOS read the DUFFY KIT
   * apple-touch-icon when the page is
   * added to the Home Screen.
   *
   * Once launched from the Home Screen,
   * it opens the real DUFFY KIT app.
   */

  if(!isStandalone()){
    return;
  }

  const key = getKey();

  if(key){
    openApp(key);
    return;
  }

  showSetup();

})();

</script>

</body>
</html>
